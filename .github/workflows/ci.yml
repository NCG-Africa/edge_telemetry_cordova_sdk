name: CI
# ponytail: no push-to-main run, the PR run already covered the same commit.
# Fixture builds and device e2e run locally (scripts/fixture-build.sh, npm run e2e:device).
on:
  pull_request:
    branches: [main]
  # release.yml re-runs it on a tag before publishing (V2).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # macOS minutes bill at 10x, so iOS unit tests only run on PRs that touch iOS code.
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo ios=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh pr diff ${{ github.event.pull_request.number }} -R ${{ github.repository }} --name-only)
          echo "ios=$(echo "$files" | grep -qE '^(ios/|Package\.swift|plugin\.xml|\.github/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:typings
      - run: npm run check:terms
      - run: npm run pack-audit
      # Spec Q2: browser harness against the fake native + mock-ingest.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  android-unit:
    # Spec Q3: JUnit + MockWebServer over the plain-Java native core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - run: gradle -p android test

  ios-unit:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Spec Q3: XCTest via Package.swift over the Foundation-only native core, on the macOS host.
    # `swift test` can't load the bundle: the package name (= plugin id) contains a slash.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild test -scheme @nathanclaire/rum-cordova -destination 'platform=macOS,arch=arm64'
