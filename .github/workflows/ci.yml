name: CI
# Runs only from release.yml on a v* tag, before publishing. JS checks only, to save Actions
# minutes: browser e2e, Android/iOS unit tests, fixture builds and device e2e run locally
# (see docs/release-checklist.md).
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:typings
      - run: npm run check:terms
      - run: npm run pack-audit
