name: Device e2e
# Spec Q4: example/ on an Android emulator and an iOS simulator against mock-ingest.
# Nightly, and required on a release tag.
on:
  schedule:
    - cron: '0 2 * * *'
  # release.yml calls it on a release tag and won't publish unless it passes.
  workflow_call:
  workflow_dispatch:
  # And on PRs that change what it drives.
  pull_request:
    paths: ['example/**', 'e2e/device/**', 'e2e/mock-ingest-server.mjs', 'scripts/example-build.sh', '.github/workflows/device-e2e.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # NDK + CMake for the E12 signal handler, at AGP's defaults (else AGP fetches them mid-build).
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: scripts/example-build.sh android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: node e2e/device/gate.mjs android

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/example-build.sh ios
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node -e '
            const d = Object.values(JSON.parse(require("fs").readFileSync(0)).devices).flat();
            console.log(d.find((x) => x.name.startsWith("iPhone")).udid)')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
      - run: node e2e/device/gate.mjs ios
