<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>edge-rum cordova harness</title>
  </head>
  <body>
    <h1>edge-rum cordova harness</h1>
    <script src="/e2e/fake-native.js"></script>
    <!-- Mimic cordova.define: www/edge-rum.js is CommonJS and <clobbers> window.EdgeRum with module.exports.
         Specs fire deviceready themselves, so pre-ready buffering is exercised too. -->
    <script>var module = { exports: {} }, exports = module.exports;</script>
    <script src="/www/edge-rum.js"></script>
    <script>window.EdgeRum = module.exports;</script>
  </body>
</html>
